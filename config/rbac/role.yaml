---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agents.agentops.io
  resources:
  - agentpools
  - agentruntimes
  - agentservices
  - agentsessions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agents.agentops.io
  resources:
  - agentpools/finalizers
  - agentruntimes/finalizers
  - agentservices/finalizers
  - agentsessions/finalizers
  verbs:
  - update
- apiGroups:
  - agents.agentops.io
  resources:
  - agentpools/status
  - agentruntimes/status
  - agentservices/status
  - agentsessions/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
