# This rule is not used by the project agentops-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to agents.steadyinfra.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agentops-operator
    app.kubernetes.io/managed-by: kustomize
  name: agentruntime-viewer-role
rules:
- apiGroups:
  - agents.steadyinfra.com
  resources:
  - agentruntimes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agents.steadyinfra.com
  resources:
  - agentruntimes/status
  verbs:
  - get
